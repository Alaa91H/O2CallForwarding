name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            VERSION_CODE=$(echo "$VERSION" | awk -F. '{print ($1 * 10000) + ($2 * 100) + $3}')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
            echo "code=1" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK
        id: build_debug
        run: |
          BUILD_OUTPUT=$(./gradlew assembleDebug --no-daemon --stacktrace 2>&1) || true
          echo "$BUILD_OUTPUT" | tail -200 > /tmp/build-debug.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 /tmp/build-debug.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if echo "$BUILD_OUTPUT" | grep -q "BUILD SUCCESSFUL"; then
            echo "✅ Build Debug APK succeeded"
            exit 0
          else
            echo "❌ Build Debug APK failed"
            exit 1
          fi
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}

      - name: Build Release AAB
        id: build_release
        if: success()
        run: |
          BUILD_OUTPUT=$(./gradlew bundleRelease --no-daemon --stacktrace 2>&1) || true
          echo "$BUILD_OUTPUT" | tail -200 > /tmp/build-release.log
          echo '## Release Build' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 /tmp/build-release.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if echo "$BUILD_OUTPUT" | grep -q "BUILD SUCCESSFUL"; then
            echo "✅ Build Release AAB succeeded"
            exit 0
          else
            echo "❌ Build Release AAB failed"
            exit 1
          fi
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}

      - name: List build outputs
        if: always()
        run: |
          echo "## Build Outputs" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs -type f 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || echo "No outputs found" >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: false
