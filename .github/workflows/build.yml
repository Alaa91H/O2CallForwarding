name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            VERSION_CODE=$(echo "$VERSION" | awk -F. '{print ($1 * 10000) + ($2 * 100) + $3}')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
            echo "code=1" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK
        id: build_debug
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 > build-full.txt
          EXIT=$?
          echo "exit=$EXIT" >> $GITHUB_OUTPUT
          # Extract error context
          grep -A 30 "FAILED\|error\|Error\|FAILURE" build-full.txt > build-errors.txt 2>/dev/null || true
          cat build-errors.txt
          echo "---FULL TAIL---"
          tail -100 build-full.txt
          exit $EXIT
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}

      - name: Commit build error
        if: failure()
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@bot.com"
          echo "=== FULL BUILD OUTPUT (last 300 lines) ===" > BUILD_ERROR_LOG.txt
          tail -300 build-full.txt >> BUILD_ERROR_LOG.txt
          echo "" >> BUILD_ERROR_LOG.txt
          echo "=== ERROR LINES ===" >> BUILD_ERROR_LOG.txt
          grep -i "error\|FAILED\|failure" build-full.txt >> BUILD_ERROR_LOG.txt 2>/dev/null || true
          git add BUILD_ERROR_LOG.txt
          git diff --cached --quiet && exit 0
          git commit -m "CI: build error log [skip ci]"
          git push origin HEAD:main

      - name: Build Release AAB
        if: success()
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: false
