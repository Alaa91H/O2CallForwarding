name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            VERSION_CODE=$(echo "$VERSION" | awk -F. '{print ($1 * 10000) + ($2 * 100) + $3}')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
            echo "code=1" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug 2>&1 | tee build.log
          echo "EXIT_CODE=$?" >> $GITHUB_ENV
          exit ${PIPESTATUS[0]}
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}

      - name: Commit build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "# Build Log - $(date -u)" > BUILD_LOG.md
          echo "Exit code: $EXIT_CODE" >> BUILD_LOG.md
          echo "" >> BUILD_LOG.md
          echo '```' >> BUILD_LOG.md
          tail -200 build.log >> BUILD_LOG.md
          echo '```' >> BUILD_LOG.md
          git add BUILD_LOG.md
          git commit -m "Debug: build log for troubleshooting"
          git push
