name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            VERSION_CODE=$(echo "$VERSION" | awk -F. '{print ($1 * 10000) + ($2 * 100) + $3}')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
            echo "code=1" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}

      - name: Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK_PATH" "O2CallForwarding-v${{ steps.version.outputs.version }}.apk"
          echo "APK_FILE=O2CallForwarding-v${{ steps.version.outputs.version }}.apk" >> $GITHUB_ENV

      - name: Build Release AAB
        run: ./gradlew bundleRelease
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}

      - name: List output files
        run: |
          echo "=== All output files ==="
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null
          echo "=== Renamed APK ==="
          ls -la *.apk 2>/dev/null || echo "No renamed APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-v${{ steps.version.outputs.version }}
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.APK_FILE }}
            app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: false
